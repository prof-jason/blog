[project]
name = "blog-backend"
version = "0.1.0"
description = "FastAPI backend for the writing prompt generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "litellm>=1.102.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live_llm: makes exactly one real OpenRouter request; also needs RUN_LIVE_LLM=1"]
